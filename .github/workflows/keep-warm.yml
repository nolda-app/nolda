name: keep-warm

# Render 무료 플랜은 15분간 요청이 없으면 잠든다. 평일 낮(KST 08:00~21:00)에만 12분마다 /health를 호출해 깨워 둔다.
# 새벽·주말에는 일부러 재우고, 첫 요청이 오면 그때 깨어난다. 이 핑은 보조 수단이다 (콜드스타트 안내 UX는 그대로 둔다).
#
# GitHub cron은 UTC 기준이다. KST = UTC+9 이므로 평일(월~금) 08:00~20:48 KST를 두 구간으로 나눈다.
#   - 월~금 KST 09:00~20:48 → UTC 월~금 00:00~11:48
#   - 월~금 KST 08:00~08:48 → UTC 일~목 23:00~23:48
# 12분 간격이라 마지막 핑은 20:48 KST이고, 그로부터 15분 뒤(21:03쯤) 잠든다.
# GitHub 스케줄은 몇 분씩 밀리거나 건너뛸 수 있고, 저장소가 60일간 활동이 없으면 꺼진다.
on:
  schedule:
    - cron: "*/12 23 * * 0-4"
    - cron: "*/12 0-11 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # 잠든 서버가 깨어나는 데 최대 1분쯤 걸려서 넉넉히 기다린다
      - run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://nolda-backend.onrender.com/health
